version: "2"

run:
  timeout: 5m
  go: "1.24"
  exclude-dirs:
    - vendor
    - internal/blockchain

# Minimal configuration using only core stable linters
# These should work in both golangci-lint v1 and v2
linters:
  enable:
    - errcheck     # Check for unchecked errors
    - govet        # Go vet tool  
    - ineffassign  # Detect ineffectual assignments
    - unused       # Check for unused code (replaces deadcode/varcheck)

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# Note: Directory/file exclusions are set here to avoid deprecated CLI flags.