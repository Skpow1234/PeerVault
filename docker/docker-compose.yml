services:
  # Bootstrap node 1 - no bootstrap peers (seed node)
  shugo-node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: shugo-node1
    ports:
      - "3000:3000"
    environment:
      - LOG_LEVEL=info
    command: ["--listen", ":3000", "--log-level", "info"]
    volumes:
      - shugo-node1-data:/app/data
    networks:
      - shugo-network
    restart: unless-stopped

  # Bootstrap node 2 - no bootstrap peers (seed node)
  shugo-node2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: shugo-node2
    ports:
      - "7000:7000"
    environment:
      - LOG_LEVEL=info
    command: ["--listen", ":7000", "--log-level", "info"]
    volumes:
      - shugo-node2-data:/app/data
    networks:
      - shugo-network
    restart: unless-stopped

  # Client node - connects to both bootstrap nodes
  shugo-node3:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: shugo-node3
    ports:
      - "5000:5000"
    environment:
      - LOG_LEVEL=info
    command: [
      "--listen", ":5000",
      "--bootstrap", "shugo-node1:3000,shugo-node2:7000",
      "--log-level", "info"
    ]
    volumes:
      - shugo-node3-data:/app/data
    networks:
      - shugo-network
    depends_on:
      - shugo-node1
      - shugo-node2
    restart: unless-stopped

  # Optional: Demo client that runs the store/get operations
  shugo-demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile.demo
    container_name: shugo-demo
    environment:
      - LOG_LEVEL=info
    command: [
      "--target", "shugo-node3:5000",
      "--bootstrap", "shugo-node1:3000,shugo-node2:7000"
    ]
    volumes:
      - shugo-demo-data:/app/data
    networks:
      - shugo-network
    depends_on:
      - shugo-node1
      - shugo-node2
      - shugo-node3
    restart: "no"

volumes:
  shugo-node1-data:
    driver: local
  shugo-node2-data:
    driver: local
  shugo-node3-data:
    driver: local
  shugo-demo-data:
    driver: local

networks:
  shugo-network:
    driver: bridge