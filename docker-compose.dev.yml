services:
  # Single container with all nodes (original behavior)
  shugo-all-in-one:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: shugo-all-in-one
    ports:
      - "3000:3000"
      - "5000:5000"
      - "7000:7000"
    environment:
      - LOG_LEVEL=info
    volumes:
      - shugo-all-data:/app/data
    restart: unless-stopped
    networks:
      - shugo-network

volumes:
  shugo-all-data:
    driver: local

networks:
  shugo-network:
    driver: bridge
